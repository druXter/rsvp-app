services:
  rsvp-app:
    build: .
    container_name: rsvp-app
    restart: unless-stopped
    ports:
      # Nur auf localhost: Der Cloudflare-Tunnel (cloudflared auf dem Host) verbindet sich über 127.0.0.1. Auf allen
      # Schnittstellen wäre das Tool über die öffentliche IPv6 des Servers am Tunnel vorbei erreichbar - dann ließe sich
      # X-Forwarded-For frei setzen und jede IP-Drosselung umgehen (suite-kit docs/KONVENTIONEN.md, "Betrieb").
      # Ports der Suite: 3005 rsvp-app, 3006 Abstimmungstool, 3007 Seating, 3008 Zeitplan, 3009 Schichten.
      - "127.0.0.1:3005:3000"
    volumes:
      # Dieser Ordner speichert deine SQLite-Datenbank sicher außerhalb des Containers,
      # damit die Gästeliste bei Updates nicht verloren geht. Der Container läuft als Nutzer
      # "node" (UID 1000) - das Verzeichnis muss ihm gehören, siehe README "Mit Docker starten".
      - ./data:/app/data
    env_file:
      - .env
    environment:
      # Teilt der App mit, wo die persistente Datenbank liegt
      - DATABASE_URL=file:/app/data/prod.db
      - TZ=Europe/Berlin
    networks:
      - default
      # Uptime Kuma (eigener Container im Netz proxy_net) prüft die Erreichbarkeit intern über http://rsvp-app:3000 -
      # der Port oben ist nur noch auf localhost offen.
      - proxy_net

networks:
  proxy_net:
    external: true
